<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
    <title>ECITT Adult Task</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Age Selection Screen -->
    <div id="ageSelectionScreen" class="screen active">
        <div class="centered-content">
            <h1 class="title">ECITT Task</h1>
            <p class="subtitle">Select Age Group</p>
            <button id="infantBtn" class="age-button">Infant (10-16 mo)</button>
            <button id="toddlerBtn" class="age-button">Toddler (17-23 mo)</button>
            <button id="childBtn" class="age-button">Child (2-17)</button>
            <button id="adultBtn" class="age-button">Adult (18+)</button>
        </div>
    </div>

    <!-- Participant ID Screen -->
    <div id="participantScreen" class="screen">
        <div class="centered-content">
            <h2 class="title">Participant Information</h2>
            <div class="input-group">
                <label for="participantIdInput">Participant ID:</label>
                <input type="text" id="participantIdInput" placeholder="e.g., PC001" autocomplete="off">
            </div>
            <button id="startBtn" class="start-button">Start Task</button>
        </div>
    </div>
    <!-- Recording Reminder Screen -->
    <div id="recordingReminderScreen" class="screen">
        <div class="centered-content">
            <h2 class="title">Start EEG Recording</h2>
            <p class="end-message">Please start the EEG recording now.</p>
            <p class="end-message">Return iPad to participant.</p>
            <button id="recordingReminderContinueBtn" class="start-button">Ready?</button>
        </div>
    </div>

    <!-- Ready Screen -->
    <div id="readyScreen" class="screen">
        <div class="screen-center">
            <div class="ready-message-top">
                <p id="readyMsg1" class="readyMessage"></p>
                <p id="readyMsg2" class="readyMessage"></p>
            </div>
            <!-- Red dot FIXED position (SAME as promptScreen) -->
            <div id="dotButton" class="dotButton" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 50;"></div>
            <div class="ready-message-btm">
                <p id="readyMsg3" class="readyMessage"></p>
            </div>
        </div>
    </div>

    <!-- Wait Screen (jitter delay — adult only, between dot press and prompt) -->
    <div id="waitScreen" class="screen"></div>

    <!-- Prompt Screen -->
    <div id="promptScreen" class="screen">
        <!-- Fixed-position red dot at screen center (ALWAYS CENTERED, NEVER MOVES) -->
        <div id="promptDot" class="dotButton" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 0;"></div>
        
        <!-- Buttons positioned FIXED (same as dot) so they align, ALWAYS ABOVE DOT for clicking -->
        <div id="topButton" class="ecittButton" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); display: none; z-index: 100;"></div>
        <div id="mdlButton" class="ecittButton" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; z-index: 100;"></div>
        <div id="btmButton" class="ecittButton" style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; z-index: 100;"></div>
    </div>

    <!-- End Screen -->
    <div id="endScreen" class="screen">
        <div class="centered-content">
            <h2 class="end-title">Task Complete!</h2>
            <div id="endStats" class="end-message"></div>
            <p class="end-message">Thank you for participating.</p>
            <button id="downloadCsvBtn" class="download-button">Download CSV</button>
            <button id="downloadVideoBtn" class="download-button">Download Video</button>
            <button id="restartBtn" class="restart-button">Start New Session</button>
        </div>
    </div>

    <!-- Inter-Block Feedback Screen -->
    <div id="interBlockScreen" class="screen">
        <div class="centered-content">
            <h2 class="title">Block Complete</h2>
            <div id="interBlockStats" class="end-message"></div>
            <button id="interBlockContinueBtn" class="start-button">Continue</button>
        </div>
    </div>

    <!-- DNF Screen -->
    <div id="dnfScreen" class="screen">
        <div class="centered-content">
            <h2 class="end-title">Session Incomplete</h2>
            <p class="end-message">The session was not completed.</p>
            <div id="dnfStats" class="end-message"></div>
            <button id="dnfDownloadCsvBtn" class="download-button">Download CSV</button>
            <button id="dnfDownloadVideoBtn" class="download-button">Download Video</button>
            <button id="dnfRestartBtn" class="restart-button">Start New Session</button>
        </div>
    </div>

    <!-- Photocell indicator (OUTSIDE all screens so it's always visible) -->
    <div id="buttonIndicator"></div>

    <!-- Reward animation overlay (OUTSIDE screens, persists across transitions) -->
    <div id="rewardAnimation" style="display:none; position:fixed; width:220px; height:220px; background-size:contain; background-repeat:no-repeat; background-position:center; z-index:200; pointer-events:none;"></div>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
        // Register service worker for offline support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(registration => {
                        console.log('[PWA] Service Worker registered:', registration.scope);
                    })
                    .catch(error => {
                        console.error('[PWA] Service Worker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
